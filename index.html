<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Super Stan (WA) Pty Ltd</title><style>body{font-family:Arial;margin:0;background:#f4f7fb;color:#152238}header{background:#062b57;color:#fff;padding:22px;text-align:center}header b{color:#ffc400}.card{max-width:680px;margin:18px auto;padding:20px;background:#fff;border-radius:16px;box-shadow:0 4px 18px #0001}label{display:block;font-weight:bold;margin:12px 0 6px}input,select,textarea{width:100%;padding:12px;box-sizing:border-box;border:1px solid #d2dbe7;border-radius:9px}button{width:100%;padding:14px;margin-top:16px;border:0;border-radius:10px;background:#ffc400;font-weight:900}</style></head><body><header><h1>🚚 Super Stan <b>(WA) Pty Ltd</b></h1>Your Freight, My Priority!</header><section class="card"><h2>Book a Delivery</h2><form id="f"><label>Pickup address *</label><input id="pickup" required><label>Delivery address *</label><input id="delivery" required><label>Date</label><input id="date" type="date"><label>Time</label><input id="time" type="time"><label>Vehicle</label><select id="vehicle"><option>Ute</option><option>Van</option><option>Truck</option></select><label>Weight (kg)</label><input id="weight" type="number"><label>Goods *</label><textarea id="goods" required></textarea><label>Name *</label><input id="name" required><label>Phone *</label><input id="phone" type="tel" required><button type="submit">SEND BOOKING REQUEST</button></form><p>📞 +61 424 851 871<br>📧 superstan.wa@gmail.com</p></section><script>f.onsubmit=e=>{e.preventDefault();localStorage.setItem("sswa_last_booking",JSON.stringify(Object.fromEntries(["pickup","delivery","date","time","vehicle","weight","goods","name","phone"].map(x=>[x,document.getElementById(x).value]))));location.href="confirmation.html"}</script></body></html>
