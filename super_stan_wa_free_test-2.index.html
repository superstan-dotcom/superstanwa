<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Super Stan (WA) Pty Ltd</title><style>body{font-family:Arial;margin:0;background:#f4f7fb;color:#152238}header{background:#062b57;color:white;padding:22px;text-align:center}header b{color:#ffc400}.card{max-width:680px;margin:18px auto;padding:20px;background:white;border-radius:16px;box-shadow:0 4px 18px #0001}label{display:block;font-weight:bold;font-size:13px;margin:12px 0 6px}input,select,textarea{width:100%;padding:12px;box-sizing:border-box;border:1px solid #d2dbe7;border-radius:9px}button{width:100%;padding:14px;margin-top:16px;border:0;border-radius:10px;background:#ffc400;font-weight:900}.success{display:none;background:#e7f7ee;padding:14px;margin-top:14px;border-radius:10px}.order{border:1px solid #ddd;padding:12px;border-radius:10px;margin-top:10px}</style></head><body><header><h1>🚚 Super Stan <b>(WA) Pty Ltd</b></h1>Your Freight, My Priority!</header><section class="card"><h2>Book a Delivery</h2><label>Pickup address *</label><input id="pickup"><label>Delivery address *</label><input id="delivery"><label>Date</label><input id="date" type="date"><label>Time</label><input id="time" type="time"><label>Vehicle</label><select id="vehicle"><option>Ute</option><option>Van</option><option>Truck</option></select><label>Weight (kg)</label><input id="weight" type="number"><label>Goods *</label><textarea id="goods" rows="3"></textarea><label>Name *</label><input id="name"><label>Phone *</label><input id="phone"><button onclick="book()">SEND BOOKING REQUEST</button><div id="success" class="success"></div><p>📞 +61 424 851 871<br>📧 superstan.wa@gmail.com</p></section><section class="card"><h2>Test Bookings</h2><div id="orders">No test bookings yet.</div></section><script>let orders=JSON.parse(localStorage.getItem("sswa_test")||"[]");function book(){if(!pickup.value||!delivery.value||!goods.value||!name.value||!phone.value){alert("Please complete required fields.");return}let o={ref:"SS"+String(Date.now()).slice(-6),pickup:pickup.value,delivery:delivery.value,date:date.value,time:time.value,vehicle:vehicle.value,weight:weight.value,goods:goods.value,name:name.value,phone:phone.value};orders.unshift(o);localStorage.setItem("sswa_test",JSON.stringify(orders));success.style.display="block";success.innerHTML="<b>Booking request saved!</b><br>Reference: "+o.ref+"<br>Free test version — saved on this device only.";render()}function render(){ordersEl=document.getElementById("orders");ordersEl.innerHTML=orders.length?orders.map(o=>'<div class="order"><b>'+o.ref+'</b><br>'+o.pickup+' → '+o.delivery+'<br>'+o.vehicle+' · '+(o.weight||"N/A")+' kg<br>'+o.goods+'<br>'+o.name+' · '+o.phone+'</div>').join(""):"No test bookings yet."}render();</script></body></html>
